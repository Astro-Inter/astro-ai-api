apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-ai-api
  labels:
    app.kubernetes.io/name: astro-ai-api
    app.kubernetes.io/part-of: astro
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-ai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-ai-api
        app.kubernetes.io/part-of: astro
    spec:
      serviceAccountName: astro-ai-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: astro-ai-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: astro-ai-api-config
            - secretRef:
                name: astro-ai-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

        - name: public-research-a2a
          image: astro-ai-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.a2a.public_research_server"]
          ports:
            - name: a2a
              containerPort: 8090
              protocol: TCP
          env:
            - name: PORT
              value: "8090"
            - name: A2A_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: astro-ai-api-secrets
                  key: A2A_SHARED_TOKEN
          envFrom:
            - configMapRef:
                name: astro-ai-api-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: a2a
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: a2a
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: a2a
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 256Mi
