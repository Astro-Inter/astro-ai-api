[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-ai-api"
version = "0.1.0"
description = "API de inteligencia artificial do Astro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135,<1.0",
    "firebase-admin>=7.5,<8.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.0.10,<2.0",
    "langchain-core>=1.2.19,<2.0",
    "langchain-groq>=1.1.2,<2.0",
    "langchain-mistralai>=1.0,<2.0",
    "pypdf>=6.0,<7.0",
    "psycopg[binary]>=3.3,<4.0",
    "tzdata>=2025.2",
    "pydantic>=2.12,<3.0",
    "python-dotenv>=1.2,<2.0",
    "pymongo>=4.13,<5.0",
    "dnspython>=2.7,<3.0",
    "qdrant-client>=1.16,<2.0",
    "uvicorn[standard]>=0.42,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
