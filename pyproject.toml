[project]
name = "astro-ai-api"
version = "0.1.0"
description = "API de inteligencia artificial do Astro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135,<1.0",
    "firebase-admin>=7.5,<8.0",
    "pydantic-settings>=2.13,<3.0",
    "uvicorn[standard]>=0.42,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
