name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      PYTHON_DOTENV_DISABLED: "1"
      LANGSMITH_TRACING: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verificar dependencias
        run: python -m pip check

      - name: Executar testes
        run: python -m pytest -q

  docker:
    name: Build Docker
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Construir imagem
        run: docker build --tag astro-ai-api:ci .

      - name: Verificar importacao da API na imagem
        run: docker run --rm --entrypoint python astro-ai-api:ci -c "from app.main import app; assert app.title == 'Astro AI API'"
