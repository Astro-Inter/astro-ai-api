name: Publicar imagem da IA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-academy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: |
          python -m pip install '.[dev]'
          python -m pip check
      - name: Executar testes sem credenciais de produção
        env:
          APP_ENV: test
          LANGSMITH_TRACING: "false"
        run: python -m pytest -q
      - name: Validar manifests do laboratório
        run: kubectl kustomize deploy/k8s/overlays/academy > /dev/null

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Entrar no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USER" --password-stdin

      - name: Construir e publicar
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/astro-inter/astro-ai-api:sha-${COMMIT_SHA}"
          docker build \
            --label org.opencontainers.image.source=https://github.com/Astro-Inter/astro-ai-api \
            --tag "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" \
            -c "from app.main import app; assert app.title == 'Astro AI API'"
          docker push "$IMAGE"

  update-gitops:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GITOPS_BRANCH: deploy/SCRUM-393-gitops-aws-academy
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Atualizar somente a branch GitOps após publicar a imagem
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo 'Execução antiga: uma versão mais nova já chegou à main.'
            exit 0
          fi
          set +e
          git ls-remote --exit-code --heads origin "$GITOPS_BRANCH" > /dev/null
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            git fetch origin "$GITOPS_BRANCH"
            git switch -c "$GITOPS_BRANCH" "origin/$GITOPS_BRANCH"
          elif [ "$result" -eq 2 ]; then
            git switch -c "$GITOPS_BRANCH" "$SOURCE_SHA"
          else
            exit "$result"
          fi
          git restore --source="$SOURCE_SHA" --staged --worktree -- deploy/k8s/base deploy/k8s/overlays/academy
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'SHA inválido'
          path = Path('deploy/k8s/overlays/academy/kustomization.yaml')
          content, count = re.subn(r'(?m)^    newTag: .+$', '    newTag: sha-' + sha, path.read_text())
          assert count == 1, 'Esperada exatamente uma tag de imagem'
          path.write_text(content)
          PY
          git add deploy/k8s/base deploy/k8s/overlays/academy
          if git diff --cached --quiet; then
            echo 'Configuração GitOps já atualizada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "ci(SCRUM-393): atualizar imagem do laboratório para sha-${SOURCE_SHA}"
          git push origin "HEAD:refs/heads/$GITOPS_BRANCH"
