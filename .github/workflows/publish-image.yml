name: Publicar imagem da IA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-academy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: |
          python -m pip install '.[dev]'
          python -m pip check
      - name: Executar testes sem credenciais de produção
        env:
          APP_ENV: test
          LANGSMITH_TRACING: "false"
        run: python -m pytest -q

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Entrar no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USER" --password-stdin

      - name: Construir e publicar
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/astro-inter/astro-ai-api:sha-${COMMIT_SHA}"
          docker build \
            --label org.opencontainers.image.source=https://github.com/Astro-Inter/astro-ai-api \
            --tag "$IMAGE" .
          docker run --rm --entrypoint python "$IMAGE" \
            -c "from app.main import app; assert app.title == 'Astro AI API'"
          docker push "$IMAGE"

  update-gitops:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Verificar permissão do repositório central
        env:
          GITOPS_TOKEN: ${{ secrets.ASTRO_GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo '::error::Configure ASTRO_GITOPS_TOKEN com acesso Contents read/write somente ao Astro-Inter/astro-gitops.'
            exit 1
          fi
      - name: Baixar configuração central
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Astro-Inter/astro-gitops
          ref: main
          token: ${{ secrets.ASTRO_GITOPS_TOKEN }}
      - name: Atualizar somente a imagem da API de IA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_SHA="$(gh api repos/Astro-Inter/astro-ai-api/commits/main --jq .sha)"
          if [ "$LATEST_SHA" != "$SOURCE_SHA" ]; then
            echo 'Execução antiga: uma versão mais nova já chegou à main.'
            exit 0
          fi
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'SHA inválido'
          path = Path('apps/astro-ai-api/overlays/academy/kustomization.yaml')
          content, count = re.subn(r'(?m)^    newTag: .+$', '    newTag: sha-' + sha, path.read_text())
          assert count == 1, 'Esperada exatamente uma tag de imagem'
          path.write_text(content)
          PY
          kubectl kustomize apps/astro-ai-api/overlays/academy > /dev/null
          git add apps/astro-ai-api/overlays/academy/kustomization.yaml
          if git diff --cached --quiet; then
            echo 'Configuração GitOps já atualizada.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "ci(SCRUM-393): atualizar imagem da api de ia para sha-${SOURCE_SHA}"
          # Nunca força push: alterações concorrentes resultam em falha segura.
          git push origin HEAD:main
